version: '3.3'
# Author: Clément Ronzon - Wikicaves
# Date: Feb 13 2021
# Requirement: docker, docker-compose

name: grottocenter

services:
  dbserver:
    container_name: ${POSTGRES_CONTAINER_NAME}
    build: ./postgis
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: pg_isready
    volumes:
      - ../sql:/docker-entrypoint-initdb.d
      - gc-postgis-data:/var/lib/postgresql
    restart: always
    ports:
      - ${POSTGRES_LOCAL_PORT}:5432

  testdbserver:
    container_name: ${POSTGRES_TEST_CONTAINER_NAME}
    build: ./postgis
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: pg_isready
    volumes:
      # Just use initDatabase sql request. The tests will populate it by themselves.
      - ../sql/0_initDatabase.sql:/docker-entrypoint-initdb.d/init.sql
      - gc-postgis-test-data:/var/lib/postgresql
    ports:
      - ${POSTGRES_TEST_LOCAL_PORT}:5432

  typesense:
    image: typesense/typesense:29.0
    container_name: ${SEARCH_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: ${SEARCH_API_KEY}
      TYPESENSE_MAX_PER_PAGE: 1000
    volumes:
      - gc-search-data:/data
    ports:
      - ${SEARCH_LOCAL_PORT}:8108
    depends_on:
      - dbserver

  # # For debuging postgresql
  # pgadmin:
  #   image: dpage/pgadmin4:7.4
  #   container_name: grotto-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   volumes:
  #     - ./pdagmin.servers.json:/pgadmin4/servers.json
  #   ports:
  #     - '5050:80'
  #   depends_on:
  #     - dbserver
  #     - testdbserver

volumes:
  gc-postgis-data:
  gc-postgis-test-data:
  gc-search-data:
