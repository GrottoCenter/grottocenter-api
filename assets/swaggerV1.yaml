      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one geographic entity (countries, regions, or massifs) must be provided and non-empty.
              required:
                - title
                - language
              properties:
                title:
                  type: string
                  description: Title of the guideline. Must be 150 characters or less and cannot be empty.
                  maxLength: 150
                countries:
                  type: array
                  description: Array of country codes to associate.
                  items:
                    type: string
                regions:
                  type: array
                  description: Array of region ISO codes to associate.
                  items:
                    type: string
                massifs:
                  type: array
                  description: Array of massif IDs to associate.
                  items:
                    type: integer
