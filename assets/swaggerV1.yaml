  '/observations/import':
    post:
      tags:
        - Observation
      summary: Import scientific observation data from a CSV/TSV file
      description: |
        Accepts a raw CSV/TSV/TXT data file and a profile JSON describing how to
        parse it. Performs an atomic ETL operation creating the full observation
        data chain (point → observation → document → time series → measurements).

        Devices and sensor configurations must exist before import — they are not
        created by this endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - profile
              properties:
                file:
                  type: string
                  format: binary
                  description: The raw CSV/TSV/TXT data file (max 100 MB)
                profile:
                  type: string
                  description: |
                    JSON-stringified object describing how to parse the file.
                    See the ObservationImportProfile schema for the full structure.
                    Key fields: encoding, headerRow, skipFirstRows, skipLastRows,
                    timezone, dateFormat/dateOnlyFormat/timeOnlyFormat, numberLocale,
                    columnMappings, caveId, authorIds, licenseId,
                    documentTitle, documentLanguage, observationName, dataQuality,
                    samplingIntervalSeconds.

                    Author attribution: `authorIds` is a required array of caver IDs
                    representing the document authors (people who contributed to the
                    data collection). All listed authors are linked to the created
                    document via the j_document_caver_author junction table.
      responses:
        '200':
          description: Import successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  observationId:
                    type: integer
                  pointId:
                    type: integer
                    nullable: true
                  documentId:
                    type: integer
                  timeSeriesMap:
                    type: object
                    description: Map of column index (from columnMappings) to created time series ID
                    additionalProperties:
                      type: integer
                  measurementCount:
                    type: integer
                  skippedMeasurements:
                    type: integer
                    description: Number of empty or whitespace-only measurement cells skipped during import (sensor gaps)
                  observationDate:
                    type: string
                    format: date-time
                  importedAt:
                    type: string
                    format: date-time
                    description: Timestamp of when the import was performed
                  importedBy:
                    type: integer
                    description: ID of the authenticated user who performed the import
        '400':
          description: |
            Validation error. Possible error codes:
            - IMPORT_VALIDATION_ERROR: Profile structure invalid (missing fields, bad locale, non-integer IDs, invalid headerRow, etc.)
            - IMPORT_REFERENCE_ERROR: Referenced entity not found (device, sensor config, cave, etc.)
            - IMPORT_PARSE_ERROR: File cannot be parsed (encoding, delimiter, empty)
            - IMPORT_TIMESTAMP_ERROR: Timestamp columns missing, unpaired, format mismatch, or epoch value out of range (1900–2100)
            - IMPORT_CONVERSION_ERROR: SI unit conversion failure or measurement column index not found in parsed data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            Conflict error. Possible error codes:
            - IMPORT_CONFLICT_ERROR: A record with conflicting unique values already exists (e.g., duplicate point label + cave)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportError'
        '500':
          description: Internal server error

