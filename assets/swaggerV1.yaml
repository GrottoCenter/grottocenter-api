    RiggingRequest:
      type: object
      required:
        - title
        - language
      properties:
        title:
          type: string
          maxLength: 300
        obstacles:
          $ref: '#/components/schemas/Obstacles'
        language:
          description: Language id used for the body. The list of languages supported by Grottocenter is available using the /languages route.
          type: string
        entrance:
          description: Entrance id which the rigging is referring to (Entrance or Cave ID required).
          type: integer
        cave:
          description: Cave id which the rigging is referring to (Entrance or Cave ID required).
          type: integer

    Search:
      properties:
        results:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/Entrance'
              - $ref: '#/components/schemas/Massif'
              - $ref: '#/components/schemas/Cave'
              - $ref: '#/components/schemas/Caver'
              - $ref: '#/components/schemas/Document'
              - $ref: '#/components/schemas/Organization'

    Search-type:
      type: string
      enum:
        - caves
        - persons
        - documents
        - entrances
        - organizations
        - massifs

    Specific-cave:
      type: object
      properties:
        id_cave:
          type: integer
        name_cave:
          type: string
        value:
          type: integer

    Statistics-country:
      type: object
      properties:
        nb_massifs:
          type: integer
        nb_caves:
          type: integer
        nb_networks:
          type: integer
        cave_with_max_depth:
          $ref: '#/components/schemas/Specific-cave'
        cave_with_max_length:
          $ref: '#/components/schemas/Specific-cave'
        diving_caves:
          type: integer
        avg:
          $ref: '#/components/schemas/Average-values'
        total_length:
          $ref: '#/components/schemas/Total-values'

    Statistics-massif:
      type: object
      properties:
        nb_caves:
          type: integer
        nb_networks:
          type: integer
        cave_with_max_depth:
          $ref: '#/components/schemas/Specific-cave'
        cave_with_max_length:
          $ref: '#/components/schemas/Specific-cave'
        diving_caves:
          type: integer
        avg:
          $ref: '#/components/schemas/Average-values'
        total_length:
          $ref: '#/components/schemas/Total-values'

    Total-values:
      type: object
      properties:
        value:
          type: integer
        nb_data:
          type: integer

    Device:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        brandName:
          type: string
          nullable: true
        serialNumber:
          type: string
          nullable: true
        productUrl:
          type: string
          nullable: true
        manufacturerUrl:
          type: string
          nullable: true
        dateInscription:
          type: string
          format: date-time
        dateReviewed:
          type: string
          format: date-time
          nullable: true
        isDeleted:
          type: boolean
        author:
          $ref: '#/components/schemas/SimpleCaver'
        reviewer:
          $ref: '#/components/schemas/SimpleCaver'
        configurations:
          type: array
          items:
            $ref: '#/components/schemas/SensorConfiguration'

    SimpleDevice:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        brandName:
          type: string
          nullable: true
        serialNumber:
          type: string
          nullable: true
        productUrl:
          type: string
          nullable: true
        manufacturerUrl:
          type: string
          nullable: true
        isDeleted:
          type: boolean

    DeviceCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 300
          description: Device name (required, non-blank).
        brandName:
          type: string
          maxLength: 200
          description: Brand name (optional).
        serialNumber:
          type: string
          maxLength: 200
          description: Manufacturer serial number (optional).
        productUrl:
          type: string
          maxLength: 500
          description: Product URL (optional).
        manufacturerUrl:
          type: string
          maxLength: 500
          description: Manufacturer URL (optional).

    DeviceUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 300
          description: Device name (non-blank if provided).
        brandName:
          type: string
          maxLength: 200
          description: Brand name.
        serialNumber:
          type: string
          maxLength: 200
          description: Manufacturer serial number.
        productUrl:
          type: string
          maxLength: 500
          description: Product URL.
        manufacturerUrl:
          type: string
          maxLength: 500
          description: Manufacturer URL.

    SensorConfiguration:
      type: object
      properties:
        id:
          type: integer
        device:
          type: integer
        quantityKind:
          type: object
          properties:
            id:
              type: integer
            code:
              type: string
            url:
              type: string
            symbolSi:
              type: string
            displayUnit:
              type: object
              description: >-
                Canonical human-friendly display unit for this quantity kind
                (e.g., °C for Temperature, hPa for Pressure).
              properties:
                id:
                  type: integer
                code:
                  type: string
                symbol:
                  type: string
        unit:
          type: object
          properties:
            id:
              type: integer
            code:
              type: string
            symbol:
              type: string
            siToDisplayFactor:
              type: number
              description: >-
                Multiplication factor to convert from SI to display unit.
                value_display = value_si * siToDisplayFactor + siToDisplayOffset
            siToDisplayOffset:
              type: number
              description: >-
                Additive offset to convert from SI to display unit.
                value_display = value_si * siToDisplayFactor + siToDisplayOffset
        label:
          type: string
          nullable: true
        substance:
          type: string
          maxLength: 100
          nullable: true
          description: >-
            Chemical species or isotope identifier (e.g. "NO₃⁻", "δ¹⁸O").
            Required for Concentration or IsotopeDelta quantity kinds, forbidden otherwise.
        idSubstance:
          type: integer
          nullable: true
          description: >-
            Foreign key to the substance reference table. When set, substanceLabel
            is automatically denormalized from the referenced substance record.
        precisionUpper:
          type: number
          nullable: true
        precisionLower:
          type: number
          nullable: true
        resolution:
          type: number
          nullable: true
        detectionLimitMin:
          type: number
          nullable: true
        detectionLimitMax:
          type: number
          nullable: true
        dateInscription:
          type: string
          format: date-time
        dateReviewed:
          type: string
          format: date-time
          nullable: true
        isDeleted:
          type: boolean
        author:
          $ref: '#/components/schemas/SimpleCaver'
        reviewer:
          $ref: '#/components/schemas/SimpleCaver'
          nullable: true

    SensorConfigurationCreate:
      type: object
      required:
        - quantityKind
        - unit
      properties:
        quantityKind:
          type: integer
          description: ID of an existing quantity kind.
        unit:
          type: integer
          description: ID of an existing unit.
        label:
          type: string
          maxLength: 300
          description: Human-readable label for the configuration (optional).
        precisionUpper:
          type: number
          description: Upper precision bound (optional).
        precisionLower:
          type: number
          description: Lower precision bound (optional).
        resolution:
          type: number
          description: Sensor resolution (optional).
        detectionLimitMin:
          type: number
          description: Minimum detection limit (optional).
        detectionLimitMax:
          type: number
          description: Maximum detection limit (optional).
        substance:
          type: string
          maxLength: 100
          nullable: true
          description: >-
            Chemical species or isotope identifier (e.g. "NO₃⁻", "δ¹⁸O").
            Required when quantityKind is Concentration or IsotopeDelta.
            Must not be provided for other quantity kinds.
        idSubstance:
          type: integer
          nullable: true
          description: >-
            Foreign key to the substance reference table. When provided,
            the substance label is automatically denormalized from the referenced
            substance record. Required when quantityKind is Concentration or
            IsotopeDelta.

    SensorConfigurationUpdate:
      type: object
      properties:
        quantityKind:
          type: integer
          description: ID of an existing quantity kind.
        unit:
          type: integer
          description: ID of an existing unit.
        label:
          type: string
          maxLength: 300
          description: Human-readable label for the configuration.
        precisionUpper:
          type: number
          description: Upper precision bound.
        precisionLower:
          type: number
          description: Lower precision bound.
        resolution:
          type: number
          description: Sensor resolution.
        detectionLimitMin:
          type: number
          description: Minimum detection limit.
        detectionLimitMax:
          type: number
          description: Maximum detection limit.
        substance:
          type: string
          maxLength: 100
          nullable: true
          description: >-
            Chemical species or isotope identifier. Required when the effective quantity kind
            (after applying any quantityKind change in the same request) is Concentration or
            IsotopeDelta. Set to null to clear. Automatically cleared when quantityKind changes
            to a non-substance-requiring type.
        idSubstance:
          type: integer
          nullable: true
          description: >-
            Foreign key to the substance reference table. Set to null to clear.
            Automatically cleared when quantityKind changes to a non-substance-requiring type.
            When set, the substance label is automatically denormalized from the referenced
            substance record.

    Substance:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 200
          description: Display name of the substance (unique, case-insensitive).
        formula:
          type: string
          maxLength: 100
          nullable: true
          description: Chemical formula (e.g. "NO₃⁻", "Ca²⁺").
        casNumber:
          type: string
          maxLength: 20
          nullable: true
          description: CAS registry number.
        externalId:
          type: string
          maxLength: 50
          nullable: true
          description: Identifier in the external registry (e.g. PubChem CID).
        externalSource:
          type: string
          maxLength: 50
          nullable: true
          description: Name of the external registry (e.g. "PubChem").
        author:
          type: integer
          description: ID of the caver who created this substance record.
        dateInscription:
          type: string
          format: date-time
          description: Timestamp when the substance was created.

    SubstanceCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 200
          description: Display name of the substance (must be unique, case-insensitive).
        formula:
          type: string
          maxLength: 100
          description: Chemical formula (optional).
        casNumber:
          type: string
          maxLength: 20
          description: CAS registry number (optional).
        externalId:
          type: string
          maxLength: 50
          description: Identifier in the external registry (optional).
        externalSource:
          type: string
          maxLength: 50
          description: Name of the external registry (optional, defaults to "PubChem" when externalId is provided).
