  '/regions/search/logical/or':
    post:
      tags:
        - regions
      description: Get a region according to the parameters given, applying a logical OR. The search is case insensitive and autocompleted (i.e. it search for the parameters being contained in the actual field).
      parameters:
        - name: query
          in: query
          description: Search query for region name or ISO code (case insensitive)
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results to return (default 10, max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          description: Number of results to skip for pagination (default 0)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [region, country]
                        iso:
                          type: string
                        name:
                          type: string
                  totalCount:
                    type: integer
                    description: Total number of matching results
                  totalPages:
                    type: integer
                    description: Total number of pages based on limit

  '/countries/{countryId}/regions/{regionId}':
    get:
      tags:
        - regions
        - countries
      description: Get a region by ID within a specific country.
      parameters:
        - name: countryId
          in: path
          description: Country ID (ISO 2-letter code)
          required: true
          schema:
            type: string
            example: US
        - name: regionId
          in: path
          description: Region ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Region'
        '404':
          description: Region not found in the specified country
        '403':
          description: Forbidden request

  '/countries/{countryId}/regions/{regionId}/subscribe':
    post:
      tags:
        - regions
        - countries
      description: Subscribe to a region within a specific country. Requires LEADER group permissions.
      parameters:
        - name: countryId
          in: path
          description: Country ID (ISO 2-letter code)
          required: true
          schema:
            type: string
            example: US
        - name: regionId
          in: path
          description: Region ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully subscribed to region
        '400':
          description: Bad request
        '403':
          description: You are not authorized to subscribe to a region
        '404':
          description: Region not found in the specified country

  '/countries/{countryId}/regions/{regionId}/unsubscribe':
    post:
      tags:
        - regions
        - countries
      description: Unsubscribe from a region within a specific country. Leaders can unsubscribe themselves. Administrators can unsubscribe any user by providing a userId query parameter.
      parameters:
        - name: countryId
          in: path
          description: Country ID (ISO 2-letter code)
          required: true
          schema:
            type: string
            example: US
        - name: regionId
          in: path
          description: Region ID
          required: true
          schema:
            type: string
        - name: userId
          in: query
          description: User ID to unsubscribe (administrators only). If not provided, unsubscribes the authenticated user.
          required: false
          schema:
            type: integer
      responses:
        '204':
          description: Successfully unsubscribed from region
        '400':
          description: You are not subscribed to this region
        '403':
          description: You are not authorized to unsubscribe from a region
        '404':
          description: Region not found in the specified country

  '/countries/{countryId}/regions/{regionId}/organizations/{organizationId}':
    put:
      tags:
        - regions
      description: Associate an organization with a region.
      security:
        - bearerAuth: []
      parameters:
        - name: countryId
          in: path
          required: true
          schema:
            type: string
        - name: regionId
          in: path
          required: true
          schema:
            type: string
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successfully associated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  organizationId:
                    type: integer
        '400':
          description: Bad request
        '401':
          description: Authentication required
        '404':
          description: Region or organization not found
    delete:
      tags:
        - regions
      description: Remove the association between an organization and a region.
      security:
        - bearerAuth: []
      parameters:
        - name: countryId
          in: path
          required: true
          schema:
            type: string
        - name: regionId
          in: path
          required: true
          schema:
            type: string
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Successfully removed association
        '401':
          description: Authentication required
        '404':
          description: Association or region not found

