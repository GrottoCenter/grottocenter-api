openapi: 3.0.0

info:
  description: "This page documents the available Grottocenter's API."
  title: 'Grottocenter API'
  version: 'v1 - 24.0.0'
  termsOfService: 'https://wiki.grottocenter.org/wiki/GrottoCenter:En/API'
  contact:
    name: 'Slack space'
    url: 'https://grottocenter.slack.com/messages/C858CHARY/'
  license:
    name: 'CC BY-SA 3.0'
    url: 'https://creativecommons.org/licenses/by-sa/3.0/'

servers:
  - url: https://api.grottocenter.org/api/v1
  - url: http://localhost:1337/api/v1

x-response-headers:
  X-Trace-Id:
    description: Trace identifier returned in response (either provided by client or generated)
    schema:
      type: string
      format: uuid
      example: '01932e9e-7890-7000-8000-0123456789ab'

tags:
  - name: account
  - name: authentication
  - name: bibliographic metadata
    description: OAI-PMH endpoints for metadata harvesting
  - name: caves
  - name: cavers
  - name: countries
  - name: descriptions
  - name: documents
  - name: entrances
  - name: file formats
  - name: geoloc
  - name: groups
  - name: guidelines
  - name: health
    description: API health monitoring endpoints
  - name: identifierTypes
  - name: languages
  - name: licenses
  - name: locations
  - name: names
  - name: massifs
  - name: mfa
    description: Multi-Factor Authentication (TOTP) enrollment, verification, and reset for administrators
  - name: organizations
  - name: regions
  - name: search
  - name: subjects
  - name: import csv
  - name: comments
  - name: riggings
  - name: messaging
  - name: devices
    description: Physical measurement instrument (device) management
  - name: SensorConfiguration
    description: Per-channel sensor configuration management (nested under devices)
  - name: Observation
    description: Scientific observation data import
  - name: Substances
    description: Substance reference table for chemical species and isotopes
  - name: SSO
    description: Single Sign-On token issuance for external product integration

paths:
  '/health':
    get:
      tags:
        - health
      description: 'Check the health of the API and its dependencies including database, search, and build information generated at build time.'
      responses:
        200:
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        503:
          description: API is unhealthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  '/licenses':
    get:
      tags:
        - licenses
      description: 'Get all the licenses present in Grottocenter.'
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/License'

  '/file-formats':
    get:
      tags:
        - file formats
      description: 'Get all the file formats present in Grottocenter.'
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/File-format'

  '/caves':
    post:
      tags:
        - caves
      description: 'Create a Cave. When submitting a new cave, you must provide an authentification token (from the /login route) in the Authorization header. This token will be used to set the author of the submission.'
      parameters:
        - name: depth
          in: query
          description: Depth of the cave
          schema:
            type: integer
        - name: descriptions
          in: query
          description: Description objects array
          required: true
          schema:
            type: array
            items:
              type: object
              properties:
                body:
                  type: string
                language:
                  type: string
                  description: Language used for the description. The list of languages supported by Grottocenter is available using the /languages route.
                title:
                  type: string
        - name: documents
          in: query
          description: Document ids related to the cave
          schema:
            type: array
            items:
              type: integer
        - name: isDiving
          in: query
          description: If the cave is flooded or not
          schema:
            type: boolean
            default: false
        - name: latitude
          in: query
          schema:
            type: number
        - name: length
          in: query
          description: Length of the cave
          schema:
            type: integer
        - name: longitude
          in: query
          schema:
            type: number
        - name: massif
          in: query
          description: Massif id in which the cave is located.
          schema:
            type: integer
        - name: name
          in: query
          description: Name object
          required: true
          schema:
            type: object
            properties:
              text:
                type: string
                description: Main name of the cave, using the local language.
              language:
                type: string
                description: Language used for the name. The list of languages supported by Grottocenter is available using the /languages route.
        - name: temperature
          in: query
          description: Average temperature in the cave
          schema:
            type: number
            format: double
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cave'
        403:
          description: You are not authorized to create a cave.

    get:
      tags:
        - caves
      description: Get all caves.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cave'

  '/caves/{id}':
    get:
      tags:
        - caves
      description: Get a cave by id.
      parameters:
        - name: id
          in: path
          description: Cave id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cave'
        '404':
          description: Cave not found.

    delete:
      tags:
        - caves
      description: Delete a cave. If a destinationCaveForOrphan parameter is provided, all the data related to the cave are transfered to the destination cave before it's deleted. If a value is set in both caves, the destination cave value is retained.
      parameters:
        - name: id
          in: path
          description: Cave id
          required: true
          schema:
            type: string
        - name: destinationCaveForOrphan
          in: query
          description: Destination cave id in which the cave data will be merged before being deleted.
          required: false
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '400':
          description: Cave(s) not found
        '410':
          description: Cave already deleted

    put:
      tags:
        - caves
      description: Update a cave. See the POST /caves route explaination about the parameters you can use to update a cave.
      parameters:
        - name: id
          in: path
          description: id of the cave to be updated.
          required: true
          schema:
            type: string
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cave'
        403:
          description: You are not authorized to update a cave.

  '/caves/{caveId}/documents/{documentId}':
    put:
      tags:
        - caves
        - documents
      description: Add a document to a cave.
      parameters:
        - name: caveId
          in: path
          description: Cave id to add the document to.
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          description: Document id to be added to the cave.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '400':
          description: "Bad request. Both the caveId and documentId parameters must exist in the database. Also, you can't add a document if it is already associated to the cave you specified."
        '403':
          description: You are not authorized to add a document to a cave.

  '/caves/{caveId}/organizations/{organizationId}':
    put:
      tags:
        - caves
        - organizations
      description: Add an organization as a cave explorer. Organization members, moderators, or administrators can manage explorer relationships.
      parameters:
        - name: caveId
          in: path
          description: Cave id to add the explorer to.
          required: true
          schema:
            type: string
        - name: organizationId
          in: path
          description: Organization id to be added as cave explorer.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '400':
          description: Organization is already exploring this cave.
        '401':
          description: Authentication required.
        '403':
          description: You are not authorized to add a cave explorer. Must be a member of the organization, moderator, or administrator.
        '404':
          description: Cave or organization not found.

    delete:
      tags:
        - caves
        - organizations
      description: Remove an organization as a cave explorer. Organization members, moderators, or administrators can manage explorer relationships.
      parameters:
        - name: caveId
          in: path
          description: Cave id to remove the explorer from.
          required: true
          schema:
            type: string
        - name: organizationId
          in: path
          description: Organization id to be removed as cave explorer.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '400':
          description: Organization is not exploring this cave.
        '401':
          description: Authentication required.
        '403':
          description: You are not authorized to remove a cave explorer. Must be a member of the organization, moderator, or administrator.
        '404':
          description: Cave or organization not found.

  '/caves/{caveId}/massif/{massifId}':
    put:
      tags:
        - caves
        - massifs
      description: Set a cave massif.
      parameters:
        - name: caveId
          in: path
          required: true
          schema:
            type: string
        - name: massifId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '400':
          description: 'Bad request. Both the caveId and massifId parameters must exist in the database.'
        '403':
          description: You are not authorized to set the massif of a cave.

  '/caves/cumulated-length':
    get:
      tags:
        - caves
      description: Get cumulated length of all caves in the database.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'

  '/cavers':
    post:
      tags:
        - cavers
      description: Create a caver (currently using only a name & surname)
      parameters:
        - name: name
          in: query
          description: Caver name
          required: true
          schema:
            type: string
        - name: surname
          in: query
          description: Caver surname
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Caver'
        '400':
          description: You must provide a surname and a name to create a new caver.
        '403':
          description: You are not authorized to create a caver.

  '/account':
    get:
      tags:
        - account
      summary: Get the authenticated user's account details
      description: Returns private account information for the currently authenticated user, including email, language preference, and notification settings.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  nickname:
                    type: string
                  name:
                    type: string
                  surname:
                    type: string
                  mail:
                    type: string
                  language:
                    type: string
                    description: ISO 639-3 language code (e.g. "fra", "eng") or "000" if not set
                  mailIsValid:
                    type: boolean
                  sendNotificationByEmail:
                    type: boolean
        '401':
          description: Unauthorized — valid JWT required.
        '404':
          description: Caver not found.
    patch:
      tags:
        - account
      summary: Update the authenticated user's account settings
      description: Update one or more account settings for the currently authenticated user. All fields are optional — only the provided fields will be updated.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: New email address
                password:
                  type: string
                  description: New password (minimum 8 characters)
                currentPassword:
                  type: string
                  description: Current password (required when changing password)
                language:
                  type: string
                  description: Preferred language as an ISO 639-3 code (e.g. "fra", "eng", "deu")
                  example: fra
                name:
                  type: string
                  description: Real name of the user (empty string clears the value)
                surname:
                  type: string
                  description: Real surname of the user (empty string clears the value)
                nickname:
                  type: string
                  description: Nickname (display name, must be unique)
                sendNotificationByEmail:
                  type: boolean
                  description: Whether to receive notifications by email
      responses:
        '200':
          description: Pending email change cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Pending email change cancelled.
        '204':
          description: Successful operation
        '400':
          description: Invalid input (unknown property, missing value, or validation error).
        '401':
          description: Unauthorized — valid JWT required.
        '403':
          description: Current password is incorrect.
        '404':
          description: Caver not found.
        '409':
          description: Email or nickname is already taken.

  '/cavers/{id}':
    get:
      tags:
        - cavers
      description: Get information about a caver. Only administrators can access all the information about caver. If you are not an administrator, you will only get the documents submitted by the user, his/her name, surname and nickname.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caver'
        '404':
          description: Caver not found.
    put:
      tags:
        - cavers
      description: Update a caver's profile. Administrator only. Use PATCH /account for self-service updates.
      parameters:
        - name: caverId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Real name of the user
                nickname:
                  type: string
                  description: Nickname (display name)
                surname:
                  type: string
                  description: Real surname of the user
                organizations:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Caver'
        '400':
          description: 'Bad request, caverId must exist in database. Or invalid fields to update'
        '403':
          description: 'You are not authorized to update a caver.'
        '404':
          description: 'Could not find caver with caverId.'

  '/cavers/admins':
    get:
      tags:
        - cavers
      description: Get all the administrators of Grottocenter.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  cavers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Caver'
        '404':
          description: No administrators found.

  '/cavers/authors/{page}':
    get:
      tags:
        - cavers
      description: Get all authors (if the user have one document in j_document_caver_author with is id) of Grottocenter. (only for moderators and administrators)
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        caverId:
                          type: integer
                        nickname:
                          type: string
                        name:
                          type: string
                        surname:
                          type: string
                        isUser:
                          type: boolean
                        isAuthor:
                          type: boolean
                        isContributor:
                          type: boolean
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid page parameter. Page must be a positive integer.
        '401':
          description: You are not authorized to get the authors of Grottocenter.
        '403':
          description: You are not authorized to access this endpoint.
        '404':
          description: No authors found.

  '/cavers/contributors/{page}':
    get:
      tags:
        - cavers
      description: Get all contributors (if the user have one document in t_document with is id in id_authors) of Grottocenter. (only for moderators and administrators)
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        caverId:
                          type: integer
                        nickname:
                          type: string
                        name:
                          type: string
                        surname:
                          type: string
                        isUser:
                          type: boolean
                        isAuthor:
                          type: boolean
                        isContributor:
                          type: boolean
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid page parameter. Page must be a positive integer.
        '401':
          description: You are not authorized to get the contributors of Grottocenter.
        '403':
          description: You are not authorized to access this endpoint.
        '404':
          description: Page not found or no contributors found.

  '/cavers/users/{page}':
    get:
      tags:
        - cavers
      description: Get all users (valid email and have a password) of Grottocenter. (only for moderators and administrators)
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        caverId:
                          type: integer
                        nickname:
                          type: string
                        name:
                          type: string
                        surname:
                          type: string
                        isUser:
                          type: boolean
                        isAuthor:
                          type: boolean
                        isContributor:
                          type: boolean
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: Invalid page parameter. Page must be a positive integer.
        '401':
          description: You are not authorized to get the users of Grottocenter.
        '403':
          description: You are not authorized to access this endpoint.
        '404':
          description: Page not found or no users found.

  '/cavers/count':
    get:
      tags:
        - cavers
      description: Get the number of cavers (both users and document authors) of the application
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'

  '/cavers/moderators':
    get:
      tags:
        - cavers
      description: Get all the moderators of Grottocenter.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  cavers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Caver'
        '404':
          description: No moderators found.

  '/cavers/{caverId}/groups':
    post:
      tags:
        - cavers
        - groups
      description: Set caver groups.
      parameters:
        - name: caverId
          in: path
          description: Caver id whose groups you want to define.
          required: true
          schema:
            type: string
        - name: groups
          in: query
          description: Group ids to set for the caver.
          required: true
          schema:
            type: array
            items:
              type: string
      responses:
        '200':
          description: Successful operation
        '400':
          description: Bad request, could not find caver with the caver id you provided or could not find one or multiple groups with group ids you provided.
        '403':
          description: You are not authorized to set caver groups.

  '/cavers/{caverId}/groups/{groupId}':
    put:
      tags:
        - cavers
        - groups
      description: Add a caver to a group.
      parameters:
        - name: caverId
          in: path
          description: Caver id to be added to the group.
          required: true
          schema:
            type: string
        - name: groupId
          in: path
          description: Group id to add the caver to.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
        '400':
          description: "Bad request. Both the caverId and groupId parameters must exist in the database. Also, you can't add a caver if he / she is already in the group you specified."
        '403':
          description: You are not authorized to add a caver to a group.

    delete:
      tags:
        - cavers
        - groups
      description: Remove a caver from a group.
      parameters:
        - name: caverId
          in: path
          description: Caver id to be removed from the group.
          required: true
          schema:
            type: string
        - name: groupId
          in: path
          description: Group id to remove the caver from.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
        '400':
          description: Bad request. Both the caverId and groupId parameters must exist in the database.
        '403':
          description: You are not authorized to remove a caver from a group.

  '/entrances/{entranceId}/cavers/{caverId}':
    put:
      tags:
        - entrances
        - cavers
      description: Add a caver as an entrance explorer. Users can only add entrances to their own profile. Moderators and administrators can add entrances to any user's profile.
      parameters:
        - name: entranceId
          in: path
          description: Entrance id to add the explorer to.
          required: true
          schema:
            type: string
        - name: caverId
          in: path
          description: Caver id to be added as entrance explorer.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '401':
          description: Authentication required.
        '403':
          description: You can only manage your own explored entrances (unless you are a moderator or administrator).
        '404':
          description: Entrance or caver not found.
        '409':
          description: Caver is already registered as an explorer of this entrance.

    delete:
      tags:
        - entrances
        - cavers
      description: Remove a caver as an entrance explorer. Users can only remove entrances from their own profile. Moderators and administrators can remove entrances from any user's profile.
      parameters:
        - name: entranceId
          in: path
          description: Entrance id to remove the explorer from.
          required: true
          schema:
            type: string
        - name: caverId
          in: path
          description: Caver id to be removed as entrance explorer.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '401':
          description: Authentication required.
        '403':
          description: You can only manage your own explored entrances (unless you are a moderator or administrator).
        '404':
          description: Entrance, caver, or explorer relationship not found.

  '/cavers/{caverId}/organizations/{organizationId}':
    put:
      tags:
        - cavers
        - organizations
      description: Add a caver to an organization. Users can only manage their own memberships unless they are administrators.
      parameters:
        - name: caverId
          in: path
          description: Caver id to be added to the organization.
          required: true
          schema:
            type: string
        - name: organizationId
          in: path
          description: Organization id to add the caver to.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
        '400':
          description: "Bad request. Both the caverId and organizationId parameters must exist in the database. Also, you can't add a caver if they are already a member of the organization."
        '403':
          description: You are not authorized to manage organization memberships for other users.
        '404':
          description: Caver or organization not found.

    delete:
      tags:
        - cavers
        - organizations
      description: Remove a caver from an organization. Users can only manage their own memberships unless they are administrators.
      parameters:
        - name: caverId
          in: path
          description: Caver id to be removed from the organization.
          required: true
          schema:
            type: string
        - name: organizationId
          in: path
          description: Organization id to remove the caver from.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
