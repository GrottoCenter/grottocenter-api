  '/documents':
    post:
      tags:
        - documents
      description: "Create a document. When submitting a new document, you must provide an authentification token (from the /login route) in the Authorization header. This token will be used to set the author of the submission. A lot of parameters are required but it depends a lot on the document type you are submitting (example: there is no publication date for a Collection but it's mandatory for an Issue. The type of the request must be a multipart/form-data if some files are uploaded."
      parameters:
        - name: authors
          in: query
          description: Author(s) id(s) of the document, the one(s) who wrote it.
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
        - name: authorsOrganization
          in: query
          description: Organization(s) (grotto/club) id(s) that authored the document.
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
        - name: datePublication
          in: query
          description: Date on which the document you submit was made public. You can refer to the date indicated on the document.
          schema:
            type: string
          examples:
            year:
              value: '2014'
              summary: Year only
            year and month:
              value: '2014-06'
              summary: Year and month
            full date:
              value: '2014-06-21'
              summary: Full date
        - name: editor
          in: query
          description: Organization that ensures the publication of the document.
          schema:
            type: object
            properties:
              id:
                type: string
        - name: identifier
          in: query
          description: Code for designating a document in a unique way. This can be a DOI, URL, ISBN or ISSN.
          schema:
            type: string
        - name: identifierType
          in: query
          description: Type of the identifier provided.
          schema:
            type: object
            properties:
              id:
                type: string
                enum: ['DOI', 'ISBN', 'ISSN', 'URL']
        - name: library
          in: query
          description: Place (= Organization) where the document can be consulted.
          schema:
            type: object
            properties:
              id:
                type: string
        - name: massif
          in: query
          description: Massif to which the document refers to.
          schema:
            type: object
            properties:
              id:
                type: string
        - name: partOf
          in: query
          description: Document that contains the document you are submitting (an article has a periodical issue as its parent document, a periodical issue has a periodical as its parent document).
          schema:
            type: object
            properties:
              id:
                type: string
        - name: regions
          in: query
          description: BBS regions to which the document refers to.
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
        - name: subjects
          in: query
          description: List of subjects and their description is available using the /documents/subjects route or here => https://www.ssslib.ch/bbs/wp-content/uploads/2017/03/chapter_and_geo_1_2008.pdf
          schema:
            type: array
            items:
              type: object
              properties:
                code:
                  type: string
        - name: documentType
          in: query
          description: Type of the document (Collection, Issue, Article or Text).
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
        - name: description
          in: query
          description: Precise sentence pleasant to read with keywords.
          schema:
            type: string
        - name: title
          in: query
          description: Title of the text as it is. In its absence, put a fictitious title between [].
          schema:
            type: string
        - name: titleAndDescriptionLanguage
          in: query
          description: Language used for the title and the description you are providing. List of languages supported by Grottocenter is available using the /languages route.
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
        - name: documentMainLanguage
          in: query
          description: Language used in the document. List of languages supported by Grottocenter is available using the /languages route.
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
        - name: files
          in: query
          description: The files linked to the document.
          schema:
            type: array
            items:
              type: string
              format: binary
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        403:
          description: You are not authorized to create a document.

    get:
      tags:
        - documents
      description: Get all documents.
      parameters:
        - name: isValidated
          in: query
          description: If the documents must be validated or not.
          required: false
          schema:
            default: true
            type: boolean
        - name: skip
          in: query
          description: Number of documents to skip.
          required: false
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          description: Maximum number of documents.
          required: false
          schema:
            type: integer
            default: 50
        - name: sortBy
          in: query
          description: Attribute to sort the documents by.
          required: false
          schema:
            type: string
            default: dateInscription
        - name: orderBy
          in: query
          description: Order used by the sortBy attribute
          required: false
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
        - name: documentType
          in: query
          description: The type of document which must be retrieved.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/Document'

  '/documents/{id}':
    get:
      tags:
        - documents
      description: Get a document by id.
      parameters:
        - name: id
          in: path
          description: Document id
          required: true
          schema:
            type: string
        - name: requireUpdate
          in: query
          description: Specify if you want to retrieve the current update (not validated) of the document
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          description: Document not found.

    put:
      tags:
        - documents
      description: >-
        Update a document. See the POST /documents route explanation about the
        parameters you can use to update a document.


        **Many-to-many collection fields** (`authors`, `authorsOrganization`,
        `subjects`, `massifs`, `isoRegions`, `countries`):


        * If a field is **omitted** from the request, the existing associations
        are left untouched.

        * If a field is sent as a **non-empty array**, it replaces the current
        associations exactly.

        * To **clear** a collection entirely, send the literal string `'[]'`
        as the field value. This is required because `multipart/form-data`
        cannot represent an empty array natively.


        **Language field**: the document language is set via `documentMainLanguage.id`
        (or the legacy `mainLanguage` field). It cannot be cleared via `'[]'`;
        omit the field to leave the language untouched.
      parameters:
        - name: id
          in: path
          description: id of the document to be updated.
          required: true
          schema:
            type: string
        - name: authorsOrganization
          in: query
          description: Organization(s) (grotto/club) id(s) that authored the document.
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        403:
          description: You are not authorized to update a document.

  '/documents/{id}/new-entities':
    put:
      tags:
        - documents
      description: >-
        Update a document and optionally create new cavers or descriptions as
        part of the same operation. This endpoint accepts JSON only.


        **Many-to-many collection fields** (`authors`, `authorsOrganization`,
        `subjects`, `languages`, `massifs`, `isoRegions`, `countries`):


        * **Omit** a field to leave existing associations untouched.

        * Send a **non-empty array** of ids to replace the current associations.

        * Send an **empty array** `[]` to clear the collection entirely.


        Note: unlike `PUT /documents/{id}` (which is `multipart/form-data`),
        this endpoint receives a JSON body, so a real empty array `[]` is used
        to clear a collection — the `'[]'` string sentinel is not needed here.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the document to update.
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document:
                  type: object
                  description: >-
                    Scalar and collection fields to update on the document.
                    Many-to-many collection fields (`authors`, `authorsOrganization`,
                    `subjects`, `languages`, `massifs`, `isoRegions`,
                    `countries`): omit to keep existing, send `[]` to clear,
                    or send an array of ids to replace.
                newAuthors:
                  type: array
                  description: >-
                    New caver records to create and link as authors. Each
                    object is passed directly to `TCaver.createEach`. The
                    junction-table row linking each new caver to the document
                    is written at creation time. If `document.authors` is also
                    present, the new ids are merged into that list before
                    `replaceCollection` runs. If `document.authors` is absent,
                    existing authors are left untouched and only the new cavers
                    are added.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      surname:
                        type: string
                      mail:
                        type: string
                newDescriptions:
                  type: array
                  description: >-
                    New description records to create and link to the document.
                    Each entry must include a `language` field.
                  items:
                    type: object
                    required:
                      - language
                    properties:
                      title:
                        type: string
                      body:
                        type: string
                      language:
                        type: string
                        description: 3-letter ISO 639-2 language code.
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: >-
            Bad request. Returned when a new description is missing the
            required `language` field.
        '401':
          description: Unauthorized. A valid bearer token is required.
        '404':
          description: Document not found or has been deleted.

