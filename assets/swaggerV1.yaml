      required: false
      schema:
        type: string
        format: uuid
        example: '01932e9e-7890-7000-8000-0123456789ab'
    sw_lat:
      name: sw_lat
      in: query
      description: South West latitude (WGS84 decimal)
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
    sw_lng:
      name: sw_lng
      in: query
      description: South West longitude (WGS84 decimal)
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
    ne_lat:
      name: ne_lat
      in: query
      description: North East latitude (WGS84 decimal)
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
    ne_lng:
      name: ne_lng
