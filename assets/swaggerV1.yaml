          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized (missing or invalid JWT token).
        '404':
          description: Referenced entity does not exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  '/guidelines/{id}':
    patch:
      tags:
        - guidelines
      description: Update a guideline. Authenticated action (only the author or a moderator can update a guideline).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Guideline ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: New title of the guideline. Must be 150 characters or less and cannot be empty.
                  maxLength: 150
                description:
                  type: string
                  description: New description. Must be 500 characters or less.
                  maxLength: 500
                  nullable: true
                language:
                  type: string
                  description: New language code.
                countries:
                  type: array
                  description: New array of country codes.
                  items:
                    type: string
                regions:
                  type: array
                  description: New array of region ISO codes.
                  items:
                    type: string
                massifs:
                  type: array
                  description: New array of massif IDs.
                  items:
                    type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guideline'
        '400':
          description: Bad Request (invalid parameter values).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized (missing or invalid JWT token).
        '403':
          description: Forbidden (user is not authorized to update this guideline).
        '404':
          description: Guideline not found or already deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

    delete:
      tags:
        - guidelines
      description: >
        Delete a guideline. By default this is a reversible soft-delete
        (moderator or administrator). When `isPermanent=true`, the guideline and
        its history snapshots and entity associations are permanently removed —
        this is irreversible and restricted to administrators.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Guideline ID to delete
        - name: isPermanent
          in: query
          required: false
          schema:
            type: boolean
          description: >
            When true, permanently (hard) delete the guideline instead of
            soft-deleting it. Administrators only.
      responses:
        '200':
          description: >
            Successful operation. Returns the deleted guideline (with
            `isDeleted: true`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guideline'
        '401':
          description: Unauthorized (missing or invalid JWT token).
        '403':
          description: >
            Forbidden (user is not authorized to delete guidelines, or is not an
            administrator when requesting a permanent deletion).
        '404':
          description: Guideline not found, or already soft-deleted (non-permanent delete only).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

