  '/entrances/with-quality/countries/{countryId}/regions/{regionId}':
    get:
      tags:
        - entrances
        - regions
      description: Get entrance data quality information for a specific region.
      parameters:
        - name: countryId
          in: path
          description: Country ID (ISO 3166-1 alpha-2 code)
          required: true
          schema:
            type: string
            example: US
        - name: regionId
          in: path
          description: Region ID (ISO 3166-2 subdivision code)
          required: true
          schema:
            type: string
            example: TN
        - name: limit
          in: query
          description: Maximum number of results to return (default 50, max 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          description: Number of results to skip for pagination (default 0)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/qualitySortCountry'
        - $ref: '#/components/parameters/qualityOrder'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  quality:
                    type: array
                    items:
                      $ref: '#/components/schemas/Data-quality-info'
