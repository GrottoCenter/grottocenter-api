          type: string
          description: Trace ID for support and debugging.
          example: 'e57c9f23-1a80-45fc-a97a-b70a823e57c9'

    ObservationImportProfile:
      type: object
      description: |
        Profile describing how to parse a CSV/TSV file for observation import.
        Passed as a JSON string in the multipart `profile` field.
      required:
        - timezone
        - columnMappings
        - authorIds
        - licenseId
      properties:
        encoding:
          type: string
          default: utf8
          description: File encoding (utf8, latin1, ascii, etc.)
        headerRow:
          type: integer
          minimum: 1
          description: 1-based row number containing column headers. Must be >= 1. Rows before it are skipped.
          example: 3
        skipFirstRows:
          type: integer
          default: 0
          description: Number of data rows to skip after the header (e.g., a units row).
        skipLastRows:
          type: integer
          default: 0
          description: Number of trailing rows to skip (e.g., summary lines).
        numberLocale:
          type: string
          enum: [en, fr]
          default: en
          description: 'Number format locale. "en" = dot decimal (1,234.56), "fr" = comma decimal (1 234,56).'
        timezone:
          type: string
          description: IANA timezone for timestamp parsing.
          example: Europe/Paris
        dateFormat:
          type: string
          description: 'Moment.js format for datetime columns (e.g., "YYYY-MM-DD HH:mm:ss").'
          nullable: true
        dateOnlyFormat:
          type: string
          description: 'Moment.js format for dateOnly columns (e.g., "MM/DD/YY").'
          nullable: true
        timeOnlyFormat:
          type: string
          description: 'Moment.js format for timeOnly columns (e.g., "HH:mm").'
          nullable: true
        columnMappings:
          type: array
          description: One entry per column in the file.
          items:
            type: object
            required:
              - columnIndex
              - role
            properties:
              columnIndex:
                type: integer
                description: 0-based column index in the file.
              role:
                type: string
                enum: [excluded, timestamp, measurement]
              timestampType:
                type: string
                enum: [datetime, dateOnly, timeOnly, year, month, day, hour, minute, second, elapsed_seconds]
                description: |
                  Required when role is "timestamp". Determines how the column contributes to the final timestamp.

                  Modes (mutually exclusive, priority order):
                  - "datetime": single column with full date+time, parsed using dateFormat.
                  - "dateOnly" + "timeOnly": two columns combined, parsed using dateOnlyFormat + timeOnlyFormat.
                  - "year"/"month"/"day"/"hour"/"minute"/"second": individual numeric components assembled into a timestamp.
                    At minimum year, month, and day are required; hour/minute/second default to 0 if absent.
                  - "elapsed_seconds" alone: interpreted as Unix epoch seconds.

                  Additionally, "elapsed_seconds" can be combined with any of the above modes, in which case it adds
                  an offset (in seconds) to the base timestamp produced by that mode.
              sensorConfigurationId:
                type: integer
                minimum: 1
                maximum: 2147483647
                description: Required when role is "measurement". Must be a positive integer.
              mediumId:
                type: integer
                minimum: 1
                maximum: 2147483647
                description: Required when role is "measurement". Must be a positive integer.
        caveId:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: Cave where the observation was made. Must be a positive integer.
          nullable: true
        pointLabel:
          type: string
          description: Label for the observation point (reuses existing or creates new). Must be a string when provided.
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        authorIds:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
          description: Caver IDs of the data authors. Must be a non-empty array of positive integers.
        licenseId:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: License ID for the created document. Must be a positive integer.
        documentTitle:
          type: string
          description: Custom title for the document. Falls back to filename if omitted.
          nullable: true
        documentLanguage:
          type: string
          description: 'ISO 639-2 code (e.g., "eng", "fra"). Required when documentTitle is provided.'
          example: eng
          nullable: true
        observationName:
          type: string
          description: Name for the observation (creates a TName record).
          nullable: true
        dataQuality:
          type: string
          enum: [raw, validated, suspect, rejected]
          default: raw
        samplingIntervalSeconds:
          type: integer
          description: Fixed sampling interval in seconds.
          nullable: true

