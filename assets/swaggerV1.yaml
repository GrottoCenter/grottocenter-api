  '/forgotPassword':
    post:
      tags:
        - account
        - authentication
      description: >-
        Launch the procedure of password change. This will send an email to the email adress you provided if it exists as a Grottocenter user's email. This email contains a password reset link expiring after 24 hours using the Grottocenter application.


        The endpoint returns 200 OK regardless of whether the account is banned or not, to prevent information leakage about ban status. If the account is banned, no reset email is sent. However, it returns 401 Unauthorized if the account is not verified yet.


        __IMPORTANT NOTICE__


        This feature uses the Grottocenter's AWS SES (Simple Email Service) of Amazon. To ️use it properly, you must have access to the service. This access is granted by the Grottocenter's developer team to developers only.Once you have the access, set your __AWS_ACCESS_KEY__ & __AWS_SECRET_KEY__ environment variables.


        Otherwise, the email will not be sent and its content will be simply logged in your console.
      parameters:
        - name: email
          in: query
          description: Email of the account you want to change the password
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '400':
          description: You must provide an email in the body of your request.
        '401':
          description: The account is not verified yet.
        '404':
          description: The email is not used by any Grottocenter's caver.

  '/login':
    post:
      tags:
        - authentication
      description: Login to Grottocenter. For administrators with active MFA, a valid TOTP code must be provided alongside credentials. For administrators without MFA enrolled, a restricted enrollment token is returned instead of a full auth token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email of the account you want to connect to
                password:
                  type: string
                  description: Password of the account you want to connect to
                totpCode:
                  type: string
                  description: 6-digit TOTP code from authenticator app (required for administrators with active MFA)
                  pattern: '^\d{6}$'
                  example: '123456'
              required:
                - email
                - password
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth-success'
        '401':
          description: |
            Authentication failed. Returns different statuses depending on the error:
            - `Mismatch`: Invalid credentials or banned account (generic message to prevent information leakage)
            - `MustReset`: Password needs to be reset
            - `NotVerified`: Account email is not activated
            - `MfaEnrollmentRequired`: Administrator must enroll in MFA before accessing the system. Response includes a short-lived `enrollmentToken` (10-min TTL) for use with `/mfa/enroll` and `/mfa/verify` endpoints.
            - `MfaRequired`: Administrator has active MFA but did not provide a TOTP code
            - `InvalidTotpCode`: The provided TOTP code is invalid or not a 6-digit numeric string
            - `TotpAlreadyUsed`: The TOTP code has already been used within its validity window (replay protection)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Auth-error'
                  - $ref: '#/components/schemas/Auth-mfa-enrollment-required'
                  - $ref: '#/components/schemas/Auth-mfa-required'
                  - $ref: '#/components/schemas/Auth-invalid-totp'
                  - $ref: '#/components/schemas/Auth-totp-already-used'

  '/mfa/enroll':
    post:
      tags:
        - mfa
      summary: Start MFA enrollment
      description: |
        Generates a TOTP secret and returns it along with an otpauth:// URI for QR code scanning.
        Requires a valid MFA enrollment token (issued by the login endpoint when MFA enrollment is required).
        If a pending (unverified) secret exists, it is replaced with a newly generated one.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Enrollment started successfully. The secret and URI are returned for the administrator to configure their authenticator app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mfa-enroll-response'
        '401':
          description: Invalid, expired, or wrong type of token. Only MFA enrollment tokens (subject 'MfaEnrollment') are accepted; full auth tokens are rejected.
        '403':
          description: Non-administrator user. MFA enrollment is only available to administrators.
        '409':
          description: MFA is already enabled for this account. Use the reset endpoint first if re-enrollment is needed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'MFA is already enabled for this account.'

  '/mfa/verify':
    post:
      tags:
        - mfa
      summary: Confirm MFA enrollment
      description: |
        Verifies a TOTP code to confirm MFA enrollment. On success, MFA is activated for the account
        and a full auth token is issued (with admin TTL of 10 days), so the administrator does not
        need to log in again.
        Requires a valid MFA enrollment token (issued by the login endpoint).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                totpCode:
                  type: string
                  description: 6-digit TOTP code from the authenticator app
                  pattern: '^\d{6}$'
                  example: '123456'
              required:
                - totpCode
      responses:
        '200':
          description: MFA enrollment confirmed. A full auth token is issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auth-success'
        '401':
          description: Invalid or expired enrollment token, or the provided TOTP code is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [InvalidTotpCode]
                  message:
                    type: string
                    example: 'The TOTP code is invalid.'

  '/mfa/reset':
    post:
      tags:
        - mfa
      summary: Reset MFA configuration
      description: |
        Resets the MFA configuration for the authenticated administrator. Clears the TOTP secret
        and sets MFA status to inactive. The current auth token remains valid until its natural
        expiration, but the next login will require MFA enrollment.
        Requires a valid full auth token (standard tokenAuth policy) and password re-entry
        to prevent stolen-token abuse.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Current account password (required for re-authentication)
              required:
                - password
      responses:
        '200':
          description: MFA has been reset successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mfa-reset-response'
        '400':
          description: Password not provided in request body.
        '401':
          description: No valid token provided, token has expired, or incorrect password.
        '403':
          description: Non-administrator user. MFA reset is only available to administrators.

  '/signup':
    post:
      tags:
        - authentication
      description: Create an account on Grottocenter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Email of the account
                nickname:
                  type: string
                  description: Nickname (how the user is displayed in the application)
                name:
                  type: string
                  description: Real name of the user
                surname:
                  type: string
                  description: Real surname of the user
                password:
                  type: string
                  description: Password of the account
                language:
                  type: string
                  description: Preferred language as an ISO 639-3 code (e.g. "fra", "eng", "deu"). If omitted, defaults to unset.
                  example: fra
              required:
                - email
                - nickname
                - password
      responses:
        '204':
          description: Successful sign up.
        '400':
          description: Bad request (password too short, missing value(s)...).
        '409':
          description: Email or nickname is already used. The response intentionally does not specify which field caused the conflict to prevent account enumeration.

  '/verify-email':
    get:
      tags:
        - authentication
      description: Verify a user's email address or an email change request using the activation token. On success, the account is activated (if not already) and any pending email change is committed.
      parameters:
        - name: token
          in: query
          description: The activation token for email verification
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account successfully verified, email change committed, or account was already verified.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: You must provide an activation token.
        '404':
          description: Activation token is invalid or has already been used.
        '409':
          description: Conflict. The new email address is now taken by another account.
        '500':
          description: An error occurred during email verification.

  '/resend-verification-email':
    post:
      tags:
        - authentication
      description: Resend the verification email to the user if they are not yet verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: The email of the account to resend the verification to
              required:
                - email
      responses:
        '204':
          description: Email resent successfully. If the user does not exist or is already verified, it returns success silently to prevent account enumeration.
        '400':
          description: Missing email parameter or the email is marked as invalid.

  '/entrances':
    post:
      tags:
        - entrances
      description: Create a cave entrance.
      parameters:
        - name: address
          in: query
          description: Address where the entrance is located
          schema:
            type: string
        - name: altitude
          in: query
          schema:
            type: number
        - name: cave
          in: query
          required: true
          description: Cave related to the entrance
          schema:
            type: number
            description: Id of the cave
        - name: city
          in: query
          description: City where the entrance is located
          schema:
            type: string
        - name: contact
          in: query
          description: Email, telephone number or name of the person responsible of the entrance
          schema:
            type: string
            example: 'Michel DUPONT 06 99 98 97 96'
        - name: country
          in: query
          description: Country where the entrance is located
          schema:
            type: string
            description: ISO 3166-1 alpha-2 code of the country where the entrance is located
        - name: county
          in: query
          description: County where the entrance is located
          schema:
            type: string
        - name: description
          in: query
          schema:
            type: object
            properties:
              body:
                type: string
              language:
                description: Must be a language supported by Grottocenter (see GET /languages route) using the 3-letters format.
                type: string
                example: 'eng'
              title:
                type: string
        - name: geology
          in: query
          description: Geology type of the entrance.
          schema:
            type: object
            properties:
              id:
                type: string
                description: Id of the geology
        - name: isPublic
          in: query
          schema:
            type: boolean
        - name: isSensitive
          in: query
          schema:
            type: boolean
        - name: isSensitiveLocked
          in: query
          description: When true, only administrators can change isSensitive (administrator-only field)
          schema:
            type: boolean
            default: false
        - name: hasBat
          in: query
          description: The cave is a known bat habitat
          schema:
            type: boolean
            default: false
        - name: dangerFlooding
          in: query
          description: Flooding risk present
          schema:
            type: boolean
            default: false
        - name: dangerCo2
          in: query
          description: CO2 accumulation risk
          schema:
            type: boolean
            default: false
        - name: dangerRockfall
          in: query
          description: Rockfall risk
          schema:
            type: boolean
            default: false
        - name: dangerPollution
          in: query
          description: Pollution risk (water contamination etc.)
          schema:
            type: boolean
            default: false
        - name: needCleanGear
          in: query
          description: Clean/decontaminated gear required (biosecurity)
          schema:
            type: boolean
            default: false
        - name: needStayOnTrail
          in: query
          description: Visitors must stay on the marked trail
          schema:
            type: boolean
            default: false
        - name: hasRules
          in: query
          description: Specific entry rules apply (permit, reservation…)
          schema:
            type: boolean
            default: false
        - name: isTouristic
          in: query
          description: Developed/touristic cave open to the public
          schema:
            type: boolean
            default: false
        - name: latitude
          in: query
          schema:
            type: number
        - name: location
          in: query
          description: Explaination of the environment around the entrance.
          schema:
            type: object
            properties:
              body:
                type: string
                example: 'The entrance is located at the top of the hill, at the left of the big rock next to the path.'
              language:
                description: Must be a language supported by Grottocenter (see GET /languages route) using the 3-letters format.
                type: string
                example: 'eng'
        - name: longitude
          in: query
          schema:
            type: number
        - name: modalities
          in: query
          schema:
            type: string
            example: 'YES,NO,NO,YES'
        - name: name
          in: query
          required: true
          description: Name of the entrance including the language used
          schema:
            type: object
            properties:
              text:
                type: string
                example: 'The entrance of ABCDEFG'
              language:
                description: Must be a language supported by Grottocenter (see GET /languages route) using the 3-letters format.
                type: string
                example: 'eng'
        - name: precision
          in: query
          description: GPS precision in meters
          schema:
            type: integer
        - name: region
          in: query
          description: Region where the entrance is located
          schema:
            type: string
        - name: yearDiscovery
          in: query
          description: Year of the discovery of the entrance (must be inferior to the current year)
          schema:
            type: number
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entrance'

  '/entrances/{entranceId}/documents/{documentId}':
    delete:
      tags:
        - entrances
        - documents
      description: Unlink a document from an entrance. Available only to the moderators.
      parameters:
        - name: entranceId
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          description: Document id to unlink from the entrance.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '404':
          description: Could not find entrance with the entrance id you provided or could not find the document with the document id you provided.

    put:
      tags:
        - entrances
        - documents
      description: Add a document to an entrance. This operation is idempotent — linking an already-linked document returns 204 without error.
      parameters:
        - name: entranceId
          in: path
          required: true
          schema:
            type: string
        - name: documentId
          in: path
          description: Document id to add to the entrance.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation (also returned if the link already exists)
        '404':
          description: Could not find entrance with the entrance id you provided or could not find the document with the document id you provided.
        '403':
          description: You are not authorized to add a document to an entrance.

  '/entrances/{entranceId}/cave/{caveId}':
    patch:
      tags:
        - entrances
        - caves
      description: Move an entrance from its case to another one. If the remaining cave is left without entrance, it's deleted.
      parameters:
        - name: entranceId
          in: path
          required: true
          schema:
            type: string
        - name: caveId
          in: path
          description: Cave id to move the entrance to
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entrance'
        '404':
          description: Could not find the entrance or the cave with the ids you provided.
        '403':
          description: You are not authorized to move an entrance from a cave to another one.

  '/entrances/findRandom':
    get:
      tags:
        - entrances
      description: Get a random entrance.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entrance'

  '/entrances/{id}':
    get:
      tags:
        - entrances
      description: |
        Get an entrance by id.
        If the entrance is sensitive (i.e. not public):
        - if you are an unauthenticated visitor, you will not be able to get it.
        - if you are an authenticated Grottocenter user, you will be able to get the entrance information but the fields "longitude", "latitude" and "locations" will be hidden.
        - if you are an authenticated Grottocenter administrator, you will be able to get all the information.
        If the entrance is deleted you will get a 200 response but the returned entrance will be partial. Only a few fields like "name", "author", ... will be provided.
        The "redirectTo" optional field is the ID of the entrance to display instead of this deleted entrance.
      parameters:
        - name: id
          in: path
          description: Entrance id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entrance'
        '403':
          description: You are not authorized to view the entrance.
        '404':
          description: Entrance not found. A deleted entrance will return a 200 response.

    delete:
      tags:
        - entrances
      description: Delete an entrance.
      parameters:
        - name: id
          in: path
          description: Entrance id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '404':
          description: Entrance not found.
        '410':
          description: Entrance already deleted.

    put:
      tags:
        - entrances
      description: Update an entrance. See the POST /entrances route explanation about the parameters you can use to update an entrance.
      parameters:
        - name: id
          in: path
          description: id of the entrance to be updated.
          required: true
          schema:
            type: string
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entrance'
        403:
          description: You are not authorized to update an entrance.

  '/entrances/publicCount':
    get:
      tags:
        - entrances
      description: Get the number of public entrances.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'

  '/entrances/count':
    get:
      tags:
        - entrances
      description: Get the number of entrances.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'

  '/entrances/check-rows':
    post:
      tags:
        - entrances
      description: Check if the entrance data sent are already present in Grottocenter. Returns which rows will be created, which are duplicates, and which are invalid.
      security:
        - bearerAuth: []
      requestBody:
        description: An object with a "data" property containing an array of entrance rows to check. Check https://ontology.uis-speleo.org/howto/ for mandatory properties.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Import-csv'
      responses:
        '200':
          description: Successful operation. Returns categorized rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  willBeCreated:
                    type: array
                    items:
                      $ref: '#/components/schemas/Import-csv'
                  willBeCreatedAsDuplicates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Import-csv'
                  wontBeCreated:
                    type: array
                    items:
                      type: object
                      properties:
                        line:
                          type: integer
        '400':
          description: Missing or invalid "data" property in request body.
        '401':
          description: Authentication required.

  '/entrances/{id}/snapshots':
    get:
      tags:
        - entrances
      description: Get snapshots of an entrance.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entrance'
        '404':
          description: We don't find these entrance's snapshots.

  '/entrances/{id}/all-snapshots':
    get:
      tags:
        - entrances
      description: Get all elements snapshots of an entrance.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntranceAllSnapshots'
        '404':
          description: We don't find these entrance's snapshots.

  '/entrances/with-quality/massifs/{id}':
    get:
      tags:
        - massifs
      description: Get the entrances of a massif with the data quality value computed
      parameters:
        - name: id
          in: path
          description: Massif id
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results to return (default 50, max 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          description: Number of results to skip for pagination (default 0)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/qualitySortAll'
        - $ref: '#/components/parameters/qualityOrder'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  quality:
                    type: array
                    items:
                      $ref: '#/components/schemas/Data-quality-info'
                  totalCount:
                    type: integer
                    description: Total number of entrances
                  totalPages:
                    type: integer
                    description: Total number of pages based on limit
        '400':
          description: Invalid sort or order parameter value. The sort column must be one of the allowed column names and order must be asc or desc.
        '404':
          description: Massif doesn't exist or hasn't entrances

  '/entrances/with-quality/countries/{id}':
    get:
      tags:
        - countries
      description: Get the entrances of a country with the data quality value computed
      parameters:
        - name: id
          in: path
          description: Country id
          example: FR, GB, IT
          required: true
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of results to return (default 50, max 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          description: Number of results to skip for pagination (default 0)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/qualitySortCountry'
        - $ref: '#/components/parameters/qualityOrder'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  quality:
                    type: array
                    items:
                      $ref: '#/components/schemas/Data-quality-info'
                  totalCount:
                    type: integer
                    description: Total number of entrances
                  totalPages:
                    type: integer
                    description: Total number of pages based on limit
        '400':
          description: Invalid sort or order parameter value. The sort column must be one of the allowed column names and order must be asc or desc.
        '404':
          description: Country doesn't exist or hasn't entrances

  '/search':
    post:
      tags:
        - search
      description: Quick search for multiple resources (persons, documents, caves, entrances, massifs, organizations). Case insensitive. Search over a many of resource properties (not only name).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Resource property (or part of property) to search.
                entities:
                  type: array
                  description: Resource types to search on. If not specified, it will search on all resources
                  items:
                    $ref: '#/components/schemas/Quicksearch-type'
                filter:
                  type: object
                  description: Filter to specify the request, the keys are field in the entities
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Search'
        '404':
          description: Resource not found

  '/advanced-search':
    post:
      tags:
        - search
      description: Search in a entity (persons, documents, caves, entrances, massifs, organizations) in the criterias mentionned in the request. It's case insensitive.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - query
                - entity
              properties:
                query:
                  type: string
                  description: Resource property (or part of property) to search.
                entity:
                  type: string
                  description: Resource type to search on
                  items:
                    $ref: '#/components/schemas/Quicksearch-type'
                sort:
                  type: string
                  description: |
                    Sort field and direction in the format "field:asc" or "field:desc".
                    The field must exist and be sortable in the target entity's schema.
                    Returns 400 if the field is invalid or not sortable.
                    Entity-specific sort fields:
                      - entrances: "dataQuality:asc" or "dataQuality:desc" (sort by data quality score)
                      - documents: "authorsSort:asc" or "authorsSort:desc" (sort by alphabetical-first author)
                    Using an entity-specific sort field with a different entity returns 400.
                  example: "cave.depth:desc"
                filter:
                  type: object
                  description: Filter to specify the request, the keys are field in the entities
                  properties:
                    dataQuality:
                      type: array
                      description: |
                        Range filter for entrance data quality score (only valid for entity=entrances).
                        A two-element array [min, max] where each element is an integer (0–100) or null.
                        - [min, max]: returns entrances with dataQuality between min and max inclusive.
                        - [min, null]: returns entrances with dataQuality >= min.
                        - [null, max]: returns entrances with dataQuality <= max.
                        Values are clamped to the 0–100 range. Non-numeric values cause the filter to be ignored.
                      minItems: 1
                      maxItems: 2
                      items:
                        type: integer
                        minimum: 0
                        maximum: 100
                        nullable: true
                      example: [50, 100]
                  additionalProperties: true
                matchAllFields:
                  type: boolean
                  description: Specify if the provided filters are added using the logical comparator "And" or "Or"
                  default: true
                page:
                  type: integer
                  description: The page number, start at 1
                size:
                  type: integer
                  description: The size of the page, default 10. Maximum 1000 due to search engine limitations.
                  default: 10
                  maximum: 1000
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Search'
        '400':
          description: Invalid sort parameter (unknown field, non-sortable field, or bad format)
        '404':
          description: Resource not found

  '/advanced-search/export':
    post:
      tags:
        - search
      description: |
        Export search results in CSV, GeoJSON, KML, or GPX format. Maximum 10,000 rows.
        Geographic formats (geojson, kml, gpx) are restricted to entrance searches only.
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum: [csv, geojson, kml, gpx]
            default: csv
          description: |
            Output format for the export. Default is "csv".
            Geographic formats (geojson, kml, gpx) are only available for entrance searches.
            When using a geo format, columns and columnsName become optional — if provided, they filter and alias the exported fields; if absent, all fields are included.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - query
                - entity
              properties:
                query:
                  type: string
                  description: Resource property (or part of property) to search.
                entity:
                  type: string
                  description: Resource type to search on
                  items:
                    $ref: '#/components/schemas/Quicksearch-type'
                sort:
                  type: string
                  description: |
                    Sort field and direction in the format "field:asc" or "field:desc".
                    The field must exist and be sortable in the target entity's schema.
                    Entity-specific sort fields:
                      - entrances: "dataQuality:asc" or "dataQuality:desc" (sort by data quality score)
                      - documents: "authorsSort:asc" or "authorsSort:desc" (sort by alphabetical-first author)
                    Using an entity-specific sort field with a different entity returns 400.
                  example: "cave.depth:desc"
                filter:
                  type: object
                  description: Filter to specify the request, the keys are field in the entities
                matchAllFields:
                  type: boolean
                  description: Specify if the provided filters are added using the logical comparator "And" or "Or"
                  default: true
                columns:
                  type: array
                  description: |
                    Fields to export. Required for CSV format.
                    For geo formats: optional — when provided, restricts which fields appear in properties/ExtendedData; when absent, all fields are included.
                  items:
                    type: string
                columnsName:
                  type: array
                  description: |
                    Display names for the exported fields. Required for CSV format (must match columns length).
                    For geo formats: optional — when provided alongside columns, aliases the field names in the output.
                  items:
                    type: string
      responses:
        '200':
          description: Successful operation
          content:
            text/csv:
              schema:
                type: string
                format: binary
              description: CSV output (default format)
            application/geo+json:
              schema:
                type: object
              description: GeoJSON FeatureCollection output
            application/vnd.google-earth.kml+xml:
              schema:
                type: string
                format: binary
              description: KML Document output
            application/gpx+xml:
              schema:
                type: string
                format: binary
              description: GPX waypoints output
        '400':
          description: |
            Bad request. Possible causes:
            - Invalid format value (must be one of: csv, geojson, kml, gpx)
            - Geographic format requested for non-entrance entity
            - Missing or invalid columns/columnsName (CSV format only)
            - Search results exceed 10,000 row limit

  '/field-search':
    post:
      tags:
        - search
      description: Get a few possible of a field for a given search
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - query
                - entity
              properties:
                field:
                  type: string
                  description: The name of field to get value of
                query:
                  type: string
                  description: Resource property (or part of property) to search.
                entity:
                  type: string
                  description: Resource type to search on
                  items:
                    $ref: '#/components/schemas/Quicksearch-type'
                size:
                  type: integer
                  description: The number of result to return, default 10
                  default: 10
                filter:
                  type: object
                  description: Filter to specify the request, the keys are field in the entities
                matchAllFields:
                  type: boolean
                  description: Specify if the provided filters are added using the logical comparator "And" or "Or"
                  default: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    description: The possible values of the field
                    items:
                      anyOf:
                        - type: string
                        - type: integer
  '/geoloc/countEntries':
    get:
      deprecated: true
      tags:
        - geoloc
      description: See countEntrances instead ! Count entrances contained inside the given coords
      parameters:
        - $ref: '#/components/parameters/sw_lat'
        - $ref: '#/components/parameters/sw_lng'
        - $ref: '#/components/parameters/ne_lat'
        - $ref: '#/components/parameters/ne_lng'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'

  '/geoloc/entrances':
    get:
      tags:
        - geoloc
      description: Get detailed entrances inside the given bounding box. Optionally filter by massif polygon. When both bounding box and massif are provided, returns entrances in the intersection of both areas.
      parameters:
        - $ref: '#/components/parameters/sw_lat'
        - $ref: '#/components/parameters/sw_lng'
        - $ref: '#/components/parameters/ne_lat'
        - $ref: '#/components/parameters/ne_lng'
        - name: massif
          in: query
          required: false
          description: Massif id to filter entrances by massif polygon
          schema:
            type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    city:
                      type: string
                    region:
                      type: string
                    caveId:
                      type: integer
                    caveName:
                      type: string
                    depth:
                      type: integer
                    length:
                      type: integer
                    longitude:
                      type: number
                    latitude:
                      type: number
                    quality:
                      type: integer
                      minimum: 0
                      maximum: 10
                      description: Cave size/importance coefficient (0–10) computed from the cave's depth and length. Used to prioritize which entrances to display at a given map zoom level.
                    dataQuality:
                      type: integer
                      minimum: 0
                      maximum: 100
                      description: Overall data quality score (0–100) representing how complete and up-to-date the entrance's data is. Returns 0 if no quality data is available.
        '404':
          description: Massif not found (when massif parameter is provided)

  '/geoloc/entrancesCoordinates':
    get:
      tags:
        - geoloc
      description: Get entrance coordinates inside the given bounding box. Optionally filter by massif polygon. When both bounding box and massif are provided, returns entrances in the intersection of both areas.
      parameters:
        - $ref: '#/components/parameters/sw_lat'
        - $ref: '#/components/parameters/sw_lng'
        - $ref: '#/components/parameters/ne_lat'
        - $ref: '#/components/parameters/ne_lng'
        - name: massif
          in: query
          required: false
          description: Massif id to filter entrances by massif polygon
          schema:
            type: integer
      responses:
        '200':
          description: List of coordinates [long,lat]
          content:
            application/json:
              example: [[4.55, 0.17], [45.89, -10.56]]
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: number
        '404':
          description: Massif not found (when massif parameter is provided)

  '/geoloc/networks':
    get:
      tags:
        - geoloc
      description: >-
        Returns networks (caves with multiple entrances) that have at least one
        non-sensitive entrance within the given bounding box. Each network includes
        a stable centroid (average of all non-sensitive entrance coordinates) and an
        entrances array with per-entrance coordinates.
      parameters:
        - $ref: '#/components/parameters/sw_lat'
        - $ref: '#/components/parameters/sw_lng'
        - $ref: '#/components/parameters/ne_lat'
        - $ref: '#/components/parameters/ne_lng'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Cave ID
                    name:
                      type: string
                      nullable: true
                      description: Network name (cave name or first entrance name)
                    longitude:
                      type: number
                      description: Centroid longitude (average of all non-sensitive entrance longitudes)
                    latitude:
                      type: number
                      description: Centroid latitude (average of all non-sensitive entrance latitudes)
                    entrances:
                      type: array
                      description: All non-sensitive, non-deleted entrances of the network
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Entrance ID
                          name:
                            type: string
                            nullable: true
                            description: Main entrance name (null if no name defined)
                          latitude:
                            type: number
                            description: Entrance latitude
                          longitude:
                            type: number
                            description: Entrance longitude
        '400':
          description: Missing or invalid bounding box parameters

  '/geoloc/networksCoordinates':
    get:
      tags:
        - geoloc
      description: Count entrances contained inside the given coords
      parameters:
        - $ref: '#/components/parameters/sw_lat'
        - $ref: '#/components/parameters/sw_lng'
        - $ref: '#/components/parameters/ne_lat'
        - $ref: '#/components/parameters/ne_lng'
      responses:
        '200':
          description: List of coordinates [long,lat]
          content:
            application/json:
              example: [[4.55, 0.17], [45.89, -10.56]]
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: number

  '/geoloc/organizations':
    get:
      tags:
        - geoloc
      description: Count entrances contained inside the given coords
      parameters:
        - $ref: '#/components/parameters/sw_lat'
        - $ref: '#/components/parameters/sw_lng'
        - $ref: '#/components/parameters/ne_lat'
        - $ref: '#/components/parameters/ne_lng'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  address:
                    type: string
                  longitude:
                    type: number
                  latitude:
                    type: number

  '/geoloc/countEntrances':
    get:
      tags:
        - geoloc
      description: Count entrances contained inside the given coords
      parameters:
        - $ref: '#/components/parameters/sw_lat'
        - $ref: '#/components/parameters/sw_lng'
        - $ref: '#/components/parameters/ne_lat'
        - $ref: '#/components/parameters/ne_lng'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'
        '404':
          description: Resource not found

  '/geoloc/massifsCoordinates':
    get:
      tags:
        - geoloc
      description: Get massif centroid coordinates inside the given bounding box. Returns an array of [longitude, latitude] pairs for use in hexbin heatmap rendering. Results are served from an in-memory snapshot cache when available, with a database fallback.
      parameters:
        - $ref: '#/components/parameters/sw_lat'
        - $ref: '#/components/parameters/sw_lng'
        - $ref: '#/components/parameters/ne_lat'
        - $ref: '#/components/parameters/ne_lng'
      responses:
        '200':
          description: Successful operation
          headers:
            Cache-Control:
              schema:
                type: string
              description: 'Cache directive, e.g. public, max-age=3600'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: array
                  items:
                    type: number
                  minItems: 2
                  maxItems: 2
                  description: '[longitude, latitude] pair'
        '400':
          description: Missing or invalid bounding box parameters
        '500':
          description: Internal server error

  '/geoloc/massifs':
    get:
      tags:
        - geoloc
      description: Get massif polygons with popup metadata inside the given bounding box. Returns massifs whose polygon intersects the bounding box, with name, GeoJSON polygon, entrance count, and network count.
      parameters:
        - $ref: '#/components/parameters/sw_lat'
        - $ref: '#/components/parameters/sw_lng'
        - $ref: '#/components/parameters/ne_lat'
        - $ref: '#/components/parameters/ne_lng'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Massif ID
                    name:
                      type: string
                      nullable: true
                      description: Main name of the massif
                    geogPolygon:
                      type: object
                      description: GeoJSON geometry object (MultiPolygon or Polygon)
                      properties:
                        type:
                          type: string
                        coordinates:
                          type: array
                          items: {}
                    entranceCount:
                      type: integer
                      description: Number of non-deleted entrances within the massif polygon
                    networkCount:
                      type: integer
                      description: Number of caves with more than one entrance within the massif polygon
        '400':
          description: Missing or invalid bounding box parameters
        '500':
          description: Internal server error

  '/massifs/count':
    get:
      tags:
        - massifs
      description: Get the total number of massifs.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'

  '/massifs':
    post:
      tags:
        - massifs
      description: Create a massif.
      parameters:
        - name: description
          in: query
          required: false
          description: Description of the massif. If provided, descriptionTitle must also be provided.
          schema:
            type: string
        - name: descriptionTitle
          in: query
          required: false
          description: Description title of the massif. If provided, description must also be provided.
          schema:
            type: string
        - name: descriptionAndNameLanguage
          in: query
          required: true
          description: Language of the description and name of the massif
          schema:
            type: object
            properties:
              id:
                type: string
                description: Must be a language supported by Grottocenter (see GET /languages route) using the 3-letters format.
        - name: geogPolygon
          in: query
          required: true
          description: A geographical polygon representation of the massif stored as a GeoJson using EPSG 4326
          schema:
            type: object
            properties:
              type:
                type: string
              coordinates:
                description: See how to construct GeoJson to know what's inside coordinates
                type: array
                items:
                  type: object
        - name: name
          in: query
          required: true
          description: Name of the massif
          schema:
            type: string
        - name: caves
          in: query
          description: List of caves ids related to the massif
          schema:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
        - name: documents
          in: query
          description: List of documents ids related to the massif
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Document'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Massif'
        '400':
          description: Some required information are missing, or the polygon area exceeds the 8 000 km² limit.
        '403':
          description: You are not authorized to create a massif.

  '/massifs/{id}':
    get:
      tags:
        - massifs
      description: Get a massif, its authors, names, geogPolygon, documents, descriptions and networks.
      parameters:
        - name: id
          in: path
          description: Massif id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Massif'
        '404':
          description: Resource not found

    put:
      tags:
        - massifs
      description: Update a massif, its list of caves, names, descriptions and documents and its geogPolygon. The polygon area must not exceed 35 000 km². Accepts an optional name field to update the main name atomically.
      parameters:
        - name: id
          in: path
          description: Massif id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                geogPolygon:
                  type: object
                  description: GeoJson EPSG4326 which represent the massif on a map
                caves:
                  type: array
                  description: List of caves ids
                  items:
                    type: object
                descriptions:
                  type: array
                  description: List of descriptions ids
                  items:
                    type: object
                documents:
                  type: array
                  description: List of documents ids
                  items:
                    type: object
                names:
                  type: array
                  description: List of names ids
                  items:
                    type: object
                isSensitiveLocked:
                  type: boolean
                  description: When true, only administrators can change the massif sensitivity. Administrator-only field; stripped for other users.
                name:
                  type: object
                  description: Optional. Update the main name inline (text and/or language).
                  properties:
                    text:
                      type: string
                      description: Name text (max 200 characters)
                      maxLength: 200
                    language:
                      type: string
                      description: ISO 639-3 language code (must exist in TLanguage)
                      example: fra
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Massif'
        '400':
          description: Bad request, name too long, language null or not found, or the polygon area exceeds the 35 000 km² limit.
        '404':
          description: Resource not found
        '403':
          description: Forbidden you don't have the rights to update massifs

  '/massifs/{id}/subscribe':
    post:
      tags:
        - massifs
      description: Subscribe to a massif. Requires LEADER group permissions.
      parameters:
        - name: id
          in: path
          description: Massif ID
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Successfully subscribed to massif
        '400':
          description: Bad request
        '403':
          description: You are not authorized to subscribe to a massif
        '404':
          description: Massif not found

  '/massifs/{id}/unsubscribe':
    post:
      tags:
        - massifs
      description: Unsubscribe from a massif. Leaders can unsubscribe themselves. Administrators can unsubscribe any user by providing a userId query parameter.
      parameters:
        - name: id
          in: path
          description: Massif ID
          required: true
          schema:
            type: integer
        - name: userId
          in: query
          description: User ID to unsubscribe (administrators only). If not provided, unsubscribes the authenticated user.
          required: false
          schema:
            type: integer
      responses:
        '204':
          description: Successfully unsubscribed from massif
        '400':
          description: You are not subscribed to this massif
        '403':
          description: You are not authorized to unsubscribe from a massif
        '404':
          description: Massif not found

  '/massifs/{id}/organizations/{organizationId}':
    put:
      tags:
        - massifs
      description: Associate an organization with a massif.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successfully associated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  organizationId:
                    type: integer
        '400':
          description: Bad request
        '401':
          description: Authentication required
        '404':
          description: Massif or organization not found
    delete:
      tags:
        - massifs
      description: Remove the association between an organization and a massif.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Successfully removed association
        '401':
          description: Authentication required
        '404':
          description: Association or massif not found

  '/massifs/{id}/statistics':
    get:
      tags:
        - massifs
      description: Get the statistics about a massif, number of caves, of networks, cave with max depth and length, number of diving caves, average depth and length & total length.
      parameters:
        - name: id
          in: path
          description: Massif id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics-massif'
        '404':
          description: Resource not found

  '/massifs/{id}/mark-sensitive':
    post:
      tags:
        - massifs
      description: Mark a massif as sensitive and propagate this status to all entrances inside it. Requires ADMINISTRATOR group permissions.
      parameters:
        - name: id
          in: path
          description: Massif ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of entrances marked as sensitive
                  skippedLockedCount:
                    type: integer
                    description: Number of entrances skipped because their sensitivity is locked
                  massif:
                    $ref: '#/components/schemas/Massif'
        '401':
          description: Authentication required.
        '403':
          description: The user is not an administrator, or the massif sensitivity is locked.
        '404':
          description: Massif not found

  '/massifs/{id}/unmark-sensitive':
    post:
      tags:
        - massifs
      description: Unmark a massif as sensitive. This action does not propagate to entrances. Requires ADMINISTRATOR group permissions.
      parameters:
        - name: id
          in: path
          description: Massif ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of entrances affected (always 0 as this action does not propagate to entrances)
                  massif:
                    $ref: '#/components/schemas/Massif'
        '401':
          description: Authentication required.
        '403':
          description: The user is not an administrator, or the massif sensitivity is locked.
        '404':
          description: Massif not found

  '/massifs/{id}/preview-sensitive':
    get:
      tags:
        - massifs
      description: Compute the number of currently unsensitive entrances that would be affected by marking this massif as sensitive. Requires ADMINISTRATOR group permissions.
      parameters:
        - name: id
          in: path
          description: Massif ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of non-sensitive, non-locked entrances that would be affected
                  lockedCount:
                    type: integer
                    description: Number of non-sensitive entrances that would be skipped because their sensitivity is locked
        '401':
          description: Authentication required.
        '403':
          description: Only administrators can perform this action.
        '404':
          description: Massif not found

  '/organizations':
    post:
      tags:
        - organizations
      description: Create an organization.
      parameters:
        - name: address
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: county
          in: query
          schema:
            type: string
        - name: country
          in: query
          schema:
            type: object
            properties:
              id:
                type: string
        - name: customMessage
          in: query
          schema:
            type: string
        - name: latitude
          in: query
          schema:
            type: number
        - name: longitude
          in: query
          schema:
            type: number
        - name: mail
          in: query
          schema:
            type: string
        - name: name
          in: query
          description: Organization main name
          required: true
          schema:
            type: object
            properties:
              text:
                type: string
              language:
                type: string
        - name: postalCode
          in: query
          schema:
            type: number
        - name: region
          in: query
          schema:
            type: string
        - name: url
          in: query
          schema:
            type: string
        - name: yearBirth
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '400':
          description: You must provide at least a name to create an organization.
        '403':
          description: You are not authorized to create an organization.

  '/organizations/{id}':
    delete:
      tags:
        - organizations
      description: Delete an organization.
      parameters:
        - name: id
          in: path
          description: Organization id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successful operation
        '404':
          description: Organization not found.
        '410':
          description: Organization already deleted.

    get:
      tags:
        - organizations
      description: Get an organization (speleo club, association, library, editor etc.) by its id.
      parameters:
        - name: id
          in: path
          description: Organization id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '404':
          description: Resource not found

    put:
      tags:
        - organizations
      description: Update an organization. Accepts an optional name field to update the main name atomically.
      parameters:
        - name: id
          in: path
          description: id of the organization to be updated.
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
                city:
                  type: string
                country:
                  type: object
                  properties:
                    id:
                      type: string
                      description: ISO 3166-1 alpha-2 country code
                county:
                  type: string
                customMessage:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
                mail:
                  type: string
                postalCode:
                  type: string
                region:
                  type: string
                url:
                  type: string
                yearBirth:
                  type: integer
                name:
                  type: object
                  description: Optional. Update the main name inline (text and/or language).
                  properties:
                    text:
                      type: string
                      description: Name text (max 200 characters)
                      maxLength: 200
                    language:
                      type: string
                      description: ISO 639-3 language code (must exist in TLanguage)
                      example: fra
      responses:
        200:
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        400:
          description: Validation error (name too long, language null or not found)
        403:
          description: You are not authorized to update an organization.
        404:
          description: Organization not found.

  '/organizations/count':
    get:
      tags:
        - organizations
      description: Get the number of organizations.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'

  '/partners/count':
    get:
      tags:
        - organizations
      description: Get the number of Grottocenter official partners.
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Count'

  '/partners/findForCarousel':
    get:
      tags:
        - organizations
      description: "Get all Grottocenter's partners which can be displayed in a carousel: it must have a picture and a custom message."
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Language'

  '/countries/{id}':
    get:
      tags:
        - countries
      description: Get a country by its id (iso 2).
      parameters:
        - name: id
          in: path
          description: Country id
          example: FR, GB, IT
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Country'
        '404':
          description: Resource not found

  '/countries/{id}/organizations/{organizationId}':
    put:
      tags:
        - countries
      description: Associate an organization with a country.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: Country ID (ISO 2-letter code)
          required: true
          schema:
            type: string
            example: FR
        - name: organizationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successfully associated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  organizationId:
                    type: integer
        '400':
          description: Bad request
        '401':
          description: Authentication required
        '404':
          description: Country or organization not found
    delete:
      tags:
