            application/json:
              schema:
                $ref: '#/components/schemas/Substance'
        '200':
          description: Existing substance returned (duplicate name).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Substance'
        '400':
          description: Validation error (missing name or name exceeds 200 characters).
        '401':
          description: Authentication required.

  '/sso/auth-token':
    post:
      tags:
        - SSO
      summary: Issue SSO authentication token
      description: >-
        Issues a short-lived JWT (30-second TTL) for cross-origin authentication with
        an external product. The token is signed with a product-specific secret and
        includes a synthetic email (no real PII). The front-end submits this token to
        the target product's SSO login endpoint via a hidden POST form.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product
              properties:
                product:
                  type: string
                  enum:
                    - superset
                  description: Target product identifier. Determines which signing secret is used.
      responses:
        '200':
          description: SSO token issued successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Signed JWT (30s TTL) for the target product.
        '400':
          description: The product field is missing, empty, or not a supported product.
        '401':
          description: Bearer token is missing, invalid, expired, or has been revoked.
        '403':
          description: Access denied (user account not found).
        '500':
          description: The signing secret is not configured for the requested product (server misconfiguration).

  '/notifications/read':
    put:
      tags:
        - notifications
      summary: Batch mark notifications as read
      description: >-
        Marks multiple notifications as read for the authenticated user.
        If `ids` is provided and non-empty, only those specific notifications are marked as read.
        If `ids` is omitted or empty, all unread notifications for the authenticated user are marked as read.
        Already-read notifications in the list are silently skipped (idempotent).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: integer
                    minimum: 1
                  description: >-
                    Specific notification IDs to mark as read. If omitted or empty,
                    all unread notifications for the authenticated user are marked as read.
                    Maximum 1000 IDs per request.
                  example: [1, 2, 3]
      responses:
        '204':
          description: Notifications successfully marked as read.
        '400':
          description: Invalid request body (ids must be an array of positive integers).
        '401':
          description: Bearer token not found or invalid.
        '403':
          description: One or more notification IDs do not belong to the authenticated user.

  '/entrances/import-rows':
    post:
      tags:
        - import csv
      summary: Enqueue entrance CSV import for async processing
      description: >-
        Validates the payload, groups rows by affinity, splits into chunks,
        and enqueues them for background processing. Returns immediately with
        a batch ID for progress polling.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '#/components/schemas/Import-csv'
      responses:
        '202':
          description: Import accepted for async processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchAccepted'
        '400':
          description: Invalid payload (empty data, missing mandatory columns).
        '403':
          description: You are not authorized to import entrances via CSV.
        '500':
          description: Job queue unavailable or batch creation failed.

  '/jobs/{batchId}':
    get:
      tags:
        - import csv
      summary: Get async job batch status
      description: >-
        Returns progress and result for an async job batch. Users can only view
        their own batches unless they have Moderator or Administrator role.
      security:
        - bearerAuth: []
      parameters:
        - name: batchId
          in: path
          required: true
          description: UUID of the job batch
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Batch status with progress and result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobBatchStatus'
        '404':
          description: Batch not found (also returned for unauthorized access to prevent leaking batch existence).

components:

  parameters:
